name: watch

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  daily-source-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily watch
        run: |
          python scripts/watch.py --lock sources.lock.json --watch-dir watch

      - name: Check for changes and notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain watch/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add watch/
            git commit -m "chore(watch): record upstream official source changes [skip ci]"
            git push origin HEAD

            # Open a GitHub issue for human review when sources change
            gh issue create \
              --title "Source changed: upstream documentation or model specs updated" \
              --body "The daily source watcher detected changes in upstream official sources. Review the diffs under watch/ and verify whether rules or model specifications require updates. A human review is required before modifying operational policies."
          else
            echo "All watched sources are unchanged or unreachable pages were caught cleanly."
          fi
